name: lint-commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  forbid-ai-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject AI-assistant attribution trailers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PATTERN='^(Co-Authored-By|Contributed-By|Contribute-By|Assisted-By|Generated-By):.*(Claude|Anthropic|OpenAI|ChatGPT|GPT|Copilot|Gemini)'
          RANGE="origin/${BASE_REF}...HEAD"
          if ! git rev-parse --verify "$RANGE" >/dev/null 2>&1; then
            echo "::warning::Could not resolve range $RANGE; skipping lint."
            exit 0
          fi
          if git log --pretty=format:'%H%n%b%n---END---' "$RANGE" | grep -B1 -E "$PATTERN"; then
            echo "::error::Found AI-assistant attribution trailer in a commit message."
            exit 1
          fi
          echo "✓ no AI-assistant trailers in commit range"
