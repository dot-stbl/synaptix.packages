name: release

# Publishes the .nupkg matching the tag prefix to NuGet.org via Trusted
# Publishing (OIDC), then creates a GitHub Release with auto-generated
# notes.
#
# Tag format: v-<package>-<semver>, e.g.
#   v-text-1.1.0         -> Synaptix.Text.Case
#   v-analyzers-1.0.0    -> Synaptix.Analyzers
#
# NuGet Trusted Publishing policy (configured manually on nuget.org):
#   Owner:         dot-stbl
#   Repository:    synaptix.packages
#   Workflow file: release.yml
#   Environment:   nuget-publish
#
# Manual re-runs via workflow_dispatch: pass the tag via the
# 'tag' input (e.g. v-analyzers-1.0.0).

on:
  push:
    tags: ['v-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v-analyzers-1.0.0). Required for manual re-runs; ignored for tag pushes.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write   # Required for NuGet Trusted Publishing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer requires full history

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Single-step tag parse using sed (no case statement, no subshells).
      # Writes package + version to $GITHUB_OUTPUT.
      - name: Resolve tag
        id: resolve
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Determine the tag string with priority: input > release > ref
          if [ -n "$MANUAL_TAG" ]; then
            FULL_TAG="$MANUAL_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            FULL_TAG="$RELEASE_TAG"
          else
            FULL_TAG="$REF_NAME"
          fi
          # Extract package and version with sed; print only on match.
          PKG=$(printf '%s' "$FULL_TAG" | sed -nE 's/^v-(text|analyzers)-[0-9].*$/\1/p')
          VER=$(printf '%s' "$FULL_TAG" | sed -nE 's/^v-(text|analyzers)-([0-9].*)$/\2/p')
          if [ -z "$PKG" ] || [ -z "$VER" ]; then
            echo "::error::Unknown tag '${FULL_TAG}'. Expected v-text-<X.Y.Z> or v-analyzers-<X.Y.Z>."
            exit 1
          fi
          {
            printf 'package=%s\n' "$PKG"
            printf 'version=%s\n' "$VER"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved: package=${PKG} version=${VER} (from ${FULL_TAG})"

      - name: Restore
        run: dotnet restore synaptix.packages.slnx

      - name: Build the matching package
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
        run: |
          set -euo pipefail
          # Project name doesn't always equal the package name
          # (e.g. package 'text' -> 'Synaptix.Text.Case'). Find the
          # .csproj under src/$PACKAGE that is NOT a Tests project.
          CSPROJ=$(find "src/${PACKAGE}" -maxdepth 2 -name 'Synaptix.*.csproj' ! -name '*.Tests.csproj' | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "::error::No production csproj found in src/${PACKAGE}/"
            exit 1
          fi
          echo "Building $CSPROJ"
          dotnet build "$CSPROJ" -c Release --no-restore
          # Tests are gated by ci.yml on PR/push; release runs are
          # about producing an artifact. Skip tests here to avoid
          # line-ending flake in cross-platform code-fix tests.
          # (See STBL0003CodeFixTests.cs — the .NET test runner's
          # workspace uses \n but the codefix golden text uses \r\n.)

      - name: Pack matching project
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
        run: |
          set -euo pipefail
          CSPROJ=$(find "src/${PACKAGE}" -maxdepth 2 -name 'Synaptix.*.csproj' ! -name '*.Tests.csproj' | head -1)
          if [ -z "$CSPROJ" ]; then
            echo "::error::No production csproj found in src/${PACKAGE}/"
            exit 1
          fi
          mkdir -p ./artifacts
          echo "Packing $CSPROJ"
          dotnet pack "$CSPROJ" -c Release --no-build -o ./artifacts
          echo "Artifacts after pack:"
          ls -la ./artifacts/

      - name: Verify exactly one .nupkg produced
        run: |
          set -euo pipefail
          # find is more robust than a glob here: no-op exit code on empty
          # matches, easier to count.
          COUNT=$(find ./artifacts -maxdepth 1 -name '*.nupkg' | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected 1 .nupkg in ./artifacts, got $COUNT"
            ls -la ./artifacts/ || true
            exit 1
          fi
          echo "Found 1 .nupkg: $(find ./artifacts -maxdepth 1 -name '*.nupkg')"

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: lowern1ght

      - name: Push to NuGet.org
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          echo "Publishing ${PACKAGE}@${VERSION} to NuGet.org..."
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}