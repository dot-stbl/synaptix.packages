name: release

# Publishes the .nupkg matching the tag prefix to NuGet.org via Trusted
# Publishing (OIDC), then creates a GitHub Release with auto-generated
# notes.
#
# Tag format: v-<package>-<semver>, e.g.
#   v-text-1.1.0         -> Synaptix.Text.Case
#   v-analyzers-1.0.0    -> Synaptix.Analyzers
#
# NuGet Trusted Publishing policy (configured manually on nuget.org):
#   Owner:         dot-stbl
#   Repository:    synaptix.packages
#   Workflow file: release.yml
#   Environment:   nuget-publish
# No long-lived API key required; NuGet/login@v1 mints a short-lived
# token via OIDC and exchanges it for a one-shot API key.

on:
  push:
    tags: ['v-*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # Required for NuGet Trusted Publishing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer requires full history

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Use github.event.release.tag_name when triggered by a published
      # release event, otherwise fall back to stripping refs/tags/ from
      # GITHUB_REF. GITHUB_REF is unreliable on workflow_dispatch re-runs.
      - name: Parse tag -> package + version
        id: parse
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$TAG_NAME" ]; then
            TAG="$TAG_NAME"
          else
            # Strip leading 'v-' from refs/tags/v-* to get the bare tag name
            TAG="${REF_NAME#v-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            text-*)
              echo "package=text" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#text-}" >> "$GITHUB_OUTPUT"
              ;;
            analyzers-*)
              echo "package=analyzers" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#analyzers-}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown tag prefix in '$TAG'. Expected v-text-* or v-analyzers-*."
              exit 1
              ;;
          esac
          echo "Resolved: package=${{ steps.parse.outputs.package }} version=${{ steps.parse.outputs.version }}"

      - name: Restore
        run: dotnet restore synaptix.packages.slnx

      - name: Build + test only the matching package
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
        run: |
          set -euo pipefail
          # Capitalize first letter: text -> Text, analyzers -> Analyzers
          PROJECT="$(tr '[:lower:]' '[:upper:]' <<< "${PACKAGE:0:1}")${PACKAGE:1}"
          dotnet build "src/${PACKAGE}/Synaptix.${PROJECT}/Synaptix.${PROJECT}.csproj" -c Release --no-restore
          dotnet test  "src/${PACKAGE}/Synaptix.${PROJECT}.Tests/Synaptix.${PROJECT}.Tests.csproj" --no-build --nologo

      - name: Pack matching project
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
        run: |
          set -euo pipefail
          PROJECT="$(tr '[:lower:]' '[:upper:]' <<< "${PACKAGE:0:1}")${PACKAGE:1}"
          mkdir -p ./artifacts
          dotnet pack "src/${PACKAGE}/Synaptix.${PROJECT}/Synaptix.${PROJECT}.csproj" -c Release --no-build -o ./artifacts
          echo "Artifacts after pack:"
          ls -la ./artifacts/

      - name: Verify exactly one .nupkg produced
        run: |
          set -euo pipefail
          COUNT=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected 1 .nupkg in ./artifacts, got $COUNT"
            ls -la ./artifacts/ || true
            exit 1
          fi
          echo "Found 1 .nupkg: $(ls ./artifacts/*.nupkg)"

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: lowern1ght

      - name: Push to NuGet.org
        env:
          PACKAGE: ${{ steps.parse.outputs.package }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          echo "Publishing ${PACKAGE}@${VERSION} to NuGet.org..."
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}