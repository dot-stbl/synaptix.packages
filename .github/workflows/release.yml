name: release

# Publishes the .nupkg matching the tag prefix to NuGet.org via Trusted
# Publishing (OIDC), then creates a GitHub Release with auto-generated
# notes.
#
# Tag format: v-<package>-<semver>, e.g.
#   v-text-1.1.0         -> Synaptix.Text.Case
#   v-analyzers-1.0.0    -> Synaptix.Analyzers
#
# NuGet Trusted Publishing policy (configured manually on nuget.org):
#   Owner:         dot-stbl
#   Repository:    synaptix.packages
#   Workflow file: release.yml
#   Environment:   nuget-publish
#
# Manual re-runs via workflow_dispatch: pass the tag via the
# 'tag' input (e.g. v-analyzers-1.0.0). Use this after fixing
# the workflow or after the Trusted Publishing policy activates.

on:
  push:
    tags: ['v-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v-analyzers-1.0.0). Required for manual re-runs; ignored for tag pushes.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write   # Required for NuGet Trusted Publishing via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # MinVer requires full history

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      # Resolve the tag and emit package + version as step outputs.
      # Done as a single command so the if/else chain produces one
      # set of values; multiple parallel writes to $GITHUB_OUTPUT
      # from a here-doc would interleave.
      - name: Resolve tag
        id: resolve
        env:
          MANUAL_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Determine the tag string with priority: input > release > ref
          if [ -n "$MANUAL_TAG" ]; then
            FULL_TAG="$MANUAL_TAG"
          elif [ -n "$RELEASE_TAG" ]; then
            FULL_TAG="$RELEASE_TAG"
          else
            FULL_TAG="$REF_NAME"
          fi
          # Strip leading v-
          TAG="${FULL_TAG#v-}"
          PACKAGE=""
          VERSION=""
          case "$TAG" in
            text-*)
              PACKAGE="text"
              VERSION="${TAG#text-}"
              ;;
            analyzers-*)
              PACKAGE="analyzers"
              VERSION="${TAG#analyzers-}"
              ;;
          esac
          {
            echo "package=${PACKAGE}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$PACKAGE" ]; then
            echo "::error::Unknown tag '${FULL_TAG}'. Expected v-text-<X.Y.Z> or v-analyzers-<X.Y.Z>."
            exit 1
          fi
          echo "Resolved: package=${{ steps.resolve.outputs.package }} version=${{ steps.resolve.outputs.version }}"

      - name: Restore
        run: dotnet restore synaptix.packages.slnx

      - name: Build + test only the matching package
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
        run: |
          # Capitalize first letter: text -> Text, analyzers -> Analyzers
          PROJECT="$(tr '[:lower:]' '[:upper:]' <<< "${PACKAGE:0:1}")${PACKAGE:1}"
          dotnet build "src/${PACKAGE}/Synaptix.${PROJECT}/Synaptix.${PROJECT}.csproj" -c Release --no-restore
          dotnet test  "src/${PACKAGE}/Synaptix.${PROJECT}.Tests/Synaptix.${PROJECT}.Tests.csproj" -c Release --no-build --nologo

      - name: Pack matching project
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
        run: |
          PROJECT="$(tr '[:lower:]' '[:upper:]' <<< "${PACKAGE:0:1}")${PACKAGE:1}"
          mkdir -p ./artifacts
          dotnet pack "src/${PACKAGE}/Synaptix.${PROJECT}/Synaptix.${PROJECT}.csproj" -c Release --no-build -o ./artifacts
          echo "Artifacts after pack:"
          ls -la ./artifacts/

      - name: Verify exactly one .nupkg produced
        run: |
          COUNT=$(ls ./artifacts/*.nupkg 2>/dev/null | wc -l | tr -d ' ')
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Expected 1 .nupkg in ./artifacts, got $COUNT"
            ls -la ./artifacts/ || true
            exit 1
          fi
          echo "Found 1 .nupkg: $(ls ./artifacts/*.nupkg)"

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: lowern1ght

      - name: Push to NuGet.org
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          echo "Publishing ${PACKAGE}@${VERSION} to NuGet.org..."
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}