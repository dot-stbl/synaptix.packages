name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget-publish
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore synaptix.packages.slnx

      - name: Build + test
        run: |
          dotnet build synaptix.packages.slnx -c Release --no-restore
          dotnet test src/text/Synaptix.Text.Case.Unit/Synaptix.Text.Case.Unit.csproj --no-build --nologo

      - name: Pack
        run: dotnet pack synaptix.packages.slnx -c Release --no-build -o ./artifacts

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          TOKEN=$(echo -n "$NUGET_API_KEY" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::NUGET_API_KEY secret is empty or not set!"
            exit 1
          fi
          echo "Publishing to NuGet.org..."
          for pkg in ./artifacts/*.nupkg; do
            echo "Pushing $pkg..."
            dotnet nuget push "$pkg" -k "$TOKEN" -s https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - name: Create GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
